name: Sync mail to ga branch

on:
  push:
    branches:
      - mail  # Trigger only when mail is updated (e.g., PR merged)

permissions:
  contents: write  # Needed to push changes
  pull-requests: read

jobs:
  sync-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mail branch
        uses: actions/checkout@v4
        with:
          ref: mail
          fetch-depth: 0  # Fetch full history for merging

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch ga branch
        run: git fetch origin ga:ga

      - name: Merge mail into ga (prefer mail changes)
        run: |
          git checkout ga
          # Merge mail into ga, automatically preferring mail's version
          git merge mail --no-edit -X theirs || true

          # If merge produces conflicts, auto-resolve them by preferring mail
          git checkout --theirs . || true
          git add .
          git commit -m "Auto-sync: merged mail into ga (preferred mail changes)" || echo "No changes to commit"

      - name: Push updated ga branch
        run: git push origin ga
